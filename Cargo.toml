[package]
name = "closet"
version = "0.1.0"
edition = "2021"
description = "Хранение информации о вещах и их местоположении (PostgreSQL)"
license = "MIT"

[lib]
name = "closet"
path = "src/lib.rs"

[[bin]]
name = "closet"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
